<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ page_title }} | Book Corner</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><style>
.admin-wrap{padding:20px 0 90px}.form-card{max-width:720px;background:var(--paper);padding:34px;box-shadow:var(--shadow);margin:60px auto}.form-card h1{font:700 42px/1.1 'Playfair Display',serif;margin:0 0 28px}.admin-form{display:grid;grid-template-columns:1fr 1fr;gap:18px}.admin-form label{font-size:11px;font-weight:700}.admin-form label.full{grid-column:1/-1}.admin-form input,.admin-form select{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 0;outline:0}.admin-form input:focus,.admin-form select:focus{border-color:var(--coral)}.check-label{display:flex;gap:9px;align-items:center}.admin-form .button{margin-top:10px}.back-link{display:inline-block;margin-top:22px;font-size:12px;color:var(--muted)}@media(max-width:760px){.admin-form{grid-template-columns:1fr}.admin-form label.full{grid-column:auto}.form-card{padding:24px 18px}}
</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="Book Corner logo"></a><nav class="main-nav" style="display:flex"><a href="{{ url_for('home') }}">Trang chủ</a><a href="{{ url_for('products') }}">Sản phẩm</a><a class="active" href="{{ url_for('admin_books') }}">Quản lý sách</a><a href="{{ url_for('contact') }}">Liên hệ</a></nav></div></header><main class="container admin-wrap"><section class="form-card"><p class="eyebrow">BOOK CORNER CMS</p><h1>{{ page_title }}</h1><form class="admin-form" method="post"><label class="full">Tên sách<input name="title" required value="{{ book.title if book else '' }}"></label><label>Tác giả<input name="author" required value="{{ book.author if book else '' }}"></label><label>Danh mục<select name="category_id" required>{% for category in categories %}<option value="{{ category.id }}" {% if book and book.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label><label>Năm xuất bản<input name="publish_year" type="number" value="{{ book.publish_year if book else '' }}"></label><label>Giá bán (VNĐ)<input name="price" type="number" min="0" value="{{ book.price if book else 0 }}"></label><label class="full">Tên file ảnh<input name="image" placeholder="vi-du.jpg" value="{{ book.image if book else '' }}"></label><label class="check-label full"><input name="in_stock" type="checkbox" {% if not book or book.in_stock %}checked{% endif %}> Còn hàng</label><button class="button button-dark" type="submit">Lưu thông tin <span>→</span></button></form><a class="back-link" href="{{ url_for('admin_books') }}">← Quay lại danh sách</a></section></main></body></html>
