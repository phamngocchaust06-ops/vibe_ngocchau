<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="150" cy="205" rx="90" ry="14" fill="#000000" opacity="0.08"/>
  <g transform="translate(75, 40)" filter="url(#shadow)">
    <!-- Fries sticks behind -->
    <rect x="25" y="10" width="14" height="100" rx="4" fill="#FBBF24" transform="rotate(-15 25 10)"/>
    <rect x="45" y="0" width="14" height="110" rx="4" fill="#F59E0B" transform="rotate(-6 45 0)"/>
    <rect x="70" y="5" width="14" height="105" rx="4" fill="#FBBF24" transform="rotate(4 70 5)"/>
    <rect x="95" y="12" width="14" height="98" rx="4" fill="#F59E0B" transform="rotate(18 95 12)"/>
    <rect x="115" y="25" width="14" height="85" rx="4" fill="#FBBF24" transform="rotate(25 115 25)"/>

    <!-- Red KFC French Fries Box -->
    <path d="M10 60 L 25 155 Q 75 165 125 155 L 140 60 Q 75 80 10 60 Z" fill="#E11D48"/>
    <rect x="50" y="95" width="50" height="35" rx="5" fill="#FFFFFF"/>
    <text x="75" y="120" font-family="'Impact', sans-serif" font-size="20" fill="#E11D48" text-anchor="middle">KFC</text>
  </g>
  <rect x="175" y="16" width="105" height="26" rx="13" fill="#E11D48"/>
  <text x="227" y="33" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">KHOAI TÂY GIÒN</text>
</svg>
