<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </radialGradient>
    <linearGradient id="origGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#D97706" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="150" cy="205" rx="100" ry="14" fill="#000000" opacity="0.08"/>
  <g transform="translate(70, 40)" filter="url(#cardShadow)">
    <path d="M20 70 Q 75 20 130 50 Q 160 100 130 140 Q 60 155 20 110 Q 5 90 20 70 Z" fill="url(#origGrad)"/>
    <circle cx="60" cy="70" r="16" fill="#FDE68A" opacity="0.6"/>
    <circle cx="100" cy="90" r="18" fill="#B45309" opacity="0.5"/>
    <circle cx="50" cy="110" r="12" fill="#FBBF24" opacity="0.6"/>
    <!-- herb flecks -->
    <circle cx="75" cy="55" r="2.5" fill="#15803D"/>
    <circle cx="115" cy="75" r="2.5" fill="#15803D"/>
    <circle cx="90" cy="115" r="2.5" fill="#15803D"/>
    <circle cx="45" cy="85" r="2.5" fill="#15803D"/>
  </g>
  <rect x="175" y="16" width="105" height="26" rx="13" fill="#D97706"/>
  <text x="227" y="33" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TRUYỀN THỐNG</text>
</svg>
