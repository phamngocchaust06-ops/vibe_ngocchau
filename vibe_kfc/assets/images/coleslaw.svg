<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="150" cy="205" rx="90" ry="14" fill="#000000" opacity="0.08"/>
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <!-- Bowl -->
    <path d="M10 60 C10 135 170 135 170 60 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Coleslaw creamy salad texture -->
    <ellipse cx="90" cy="60" rx="75" ry="30" fill="#F0FDF4"/>
    <!-- Shredded cabbage and carrots -->
    <path d="M35 55 Q 50 45 70 60" stroke="#22C55E" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M60 45 Q 85 40 100 55" stroke="#F97316" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M80 65 Q 110 50 135 60" stroke="#16A34A" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M110 48 Q 130 40 145 55" stroke="#EA580C" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M45 70 Q 75 60 95 72" stroke="#86EFAC" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="175" y="16" width="105" height="26" rx="13" fill="#16A34A"/>
  <text x="227" y="33" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BẮP CẢI TRỘN</text>
</svg>
