<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="150" cy="205" rx="110" ry="14" fill="#000000" opacity="0.08"/>
  
  <g filter="url(#shadow)">
    <!-- Drink Cup (Right) -->
    <path d="M195 90 L 205 185 Q 225 190 245 185 L 255 90 Z" fill="#0284C7"/>
    <ellipse cx="225" cy="90" rx="30" ry="8" fill="#E0F2FE"/>
    <path d="M225 90 L 225 50" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/>
    <text x="225" y="145" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">PEPSI</text>

    <!-- Fries Pouch (Center) -->
    <path d="M120 110 L 125 185 Q 155 190 185 185 L 190 110 Z" fill="#E11D48"/>
    <!-- Fries sticks -->
    <rect x="130" y="80" width="8" height="50" rx="3" fill="#FBBF24" transform="rotate(-5 130 80)"/>
    <rect x="142" y="70" width="8" height="60" rx="3" fill="#F59E0B"/>
    <rect x="154" y="75" width="8" height="55" rx="3" fill="#FBBF24" transform="rotate(6 154 75)"/>
    <rect x="166" y="85" width="8" height="45" rx="3" fill="#F59E0B" transform="rotate(12 166 85)"/>
    <text x="155" y="155" font-family="Impact" font-size="14" fill="#FFF" text-anchor="middle">KFC</text>

    <!-- Chicken Leg (Left) -->
    <path d="M55 170 C45 180 35 190 45 195 C55 200 65 190 60 180 Z" fill="#FEF3C7"/>
    <path d="M40 95 C20 120 25 160 55 180 C80 160 90 115 75 90 C60 70 45 75 40 95 Z" fill="#D97706"/>
    <circle cx="50" cy="115" r="10" fill="#FDE68A" opacity="0.5"/>
  </g>
  <rect x="175" y="16" width="105" height="26" rx="13" fill="#E11D48"/>
  <text x="227" y="33" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">COMBO SOLO</text>
</svg>
