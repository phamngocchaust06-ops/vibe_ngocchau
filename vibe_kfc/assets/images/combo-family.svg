<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="150" cy="205" rx="110" ry="14" fill="#000000" opacity="0.08"/>
  <g filter="url(#shadow)">
    <!-- Bucket in background -->
    <path d="M70 110 L 85 190 Q 130 198 175 190 L 190 110 Q 130 120 70 110 Z" fill="#FFFFFF" stroke="#E5E7EB"/>
    <path d="M90 112 L 100 192 Q 115 195 130 196 L 125 115 Q 107 113 90 112 Z" fill="#E11D48"/>
    <path d="M150 115 L 145 196 Q 160 195 170 192 L 180 112 Q 165 113 150 115 Z" fill="#E11D48"/>
    <!-- Chicken pieces overflowing -->
    <circle cx="105" cy="95" r="22" fill="#D97706"/>
    <circle cx="140" cy="90" r="24" fill="#EA580C"/>
    <circle cx="160" cy="105" r="18" fill="#D97706"/>

    <!-- Burger front right -->
    <g transform="translate(160, 120) scale(0.6)">
      <path d="M20 60 Q 60 15 100 60 Z" fill="#F59E0B"/>
      <rect x="15" y="60" width="90" height="10" rx="5" fill="#22C55E"/>
      <rect x="18" y="70" width="84" height="15" rx="4" fill="#991B1B"/>
      <rect x="20" y="85" width="80" height="18" rx="8" fill="#F59E0B"/>
    </g>

    <!-- 2 Drinks -->
    <g transform="translate(20, 80) scale(0.6)">
      <path d="M30 50 L 40 140 Q 60 145 80 140 L 90 50 Z" fill="#0284C7"/>
      <path d="M60 50 L 60 20" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(230, 80) scale(0.6)">
      <path d="M30 50 L 40 140 Q 60 145 80 140 L 90 50 Z" fill="#0284C7"/>
      <path d="M60 50 L 60 20" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <rect x="160" y="16" width="125" height="26" rx="13" fill="#D97706"/>
  <text x="222" y="33" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">COMBO GIA ĐÌNH</text>
</svg>
