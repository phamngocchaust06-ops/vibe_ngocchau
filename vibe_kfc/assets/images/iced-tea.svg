<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </radialGradient>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#C2410C" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="150" cy="205" rx="80" ry="14" fill="#000000" opacity="0.08"/>
  <g transform="translate(100, 30)" filter="url(#shadow)">
    <!-- Straw -->
    <path d="M50 35 L 50 10 L 65 0" stroke="#16A34A" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Lid -->
    <ellipse cx="50" cy="35" rx="45" ry="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Transparent/Tea cup body -->
    <path d="M10 35 L 22 165 Q 50 172 78 165 L 90 35 Z" fill="url(#teaGrad)" opacity="0.9"/>
    <!-- Peach slice -->
    <circle cx="35" cy="80" r="16" fill="#FB923C"/>
    <circle cx="35" cy="80" r="12" fill="#FED7AA"/>
    <!-- Chia seeds -->
    <circle cx="50" cy="110" r="2" fill="#000"/>
    <circle cx="65" cy="125" r="2" fill="#000"/>
    <circle cx="42" cy="135" r="2" fill="#000"/>
    <circle cx="58" cy="148" r="2" fill="#000"/>
    <!-- Mint leaf on top -->
    <path d="M65 30 Q 75 18 85 25 Q 85 38 65 30 Z" fill="#22C55E"/>
  </g>
  <rect x="175" y="16" width="105" height="26" rx="13" fill="#EA580C"/>
  <text x="227" y="33" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TRÀ ĐÀO CHIA</text>
</svg>
