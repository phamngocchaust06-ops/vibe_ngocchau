<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEFCE8"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </radialGradient>
    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#78350F" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="150" cy="205" rx="100" ry="14" fill="#000000" opacity="0.08"/>
  <g transform="translate(60, 45)" filter="url(#shadow)">
    <!-- Top Bun -->
    <path d="M15 75 C15 15 165 15 165 75 Z" fill="url(#bunGrad)"/>
    <!-- Pepper glaze Roast patty -->
    <rect x="18" y="80" width="144" height="26" rx="10" fill="#451A03"/>
    <!-- Black pepper flakes -->
    <circle cx="45" cy="88" r="2" fill="#000"/>
    <circle cx="75" cy="94" r="2" fill="#000"/>
    <circle cx="115" cy="87" r="2" fill="#000"/>
    <circle cx="140" cy="95" r="2" fill="#000"/>
    <!-- Lettuce -->
    <path d="M15 110 Q 30 100 50 115 Q 70 100 90 115 Q 110 100 130 115 Q 150 100 165 110" stroke="#16A34A" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Bottom Bun -->
    <path d="M20 120 L 160 120 C160 145 20 145 20 120 Z" fill="url(#bunGrad)"/>
  </g>
  <rect x="175" y="16" width="105" height="26" rx="13" fill="#451A03"/>
  <text x="227" y="33" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GÀ QUAY TIÊU</text>
</svg>
