<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDF4FF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </radialGradient>
    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#78350F" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="150" cy="205" rx="100" ry="14" fill="#000000" opacity="0.08"/>
  <g transform="translate(60, 45)" filter="url(#shadow)">
    <!-- Top Bun -->
    <path d="M15 75 C15 15 165 15 165 75 Z" fill="url(#bunGrad)"/>
    <ellipse cx="75" cy="45" rx="3" ry="1.5" fill="#FEF3C7"/>
    <ellipse cx="105" cy="40" rx="3" ry="1.5" fill="#FEF3C7"/>
    <ellipse cx="130" cy="55" rx="3" ry="1.5" fill="#FEF3C7"/>

    <!-- Tartar Sauce -->
    <path d="M25 75 Q 90 85 155 75" stroke="#FEF08A" stroke-width="7" stroke-linecap="round"/>

    <!-- Lettuce -->
    <path d="M10 80 Q 30 70 50 85 Q 70 70 90 85 Q 110 70 130 85 Q 150 70 170 80" stroke="#10B981" stroke-width="12" fill="none" stroke-linecap="round"/>

    <!-- Shrimp Patty -->
    <rect x="20" y="90" width="140" height="25" rx="8" fill="#F97316"/>
    <circle cx="50" cy="102" r="5" fill="#FB923C"/>
    <circle cx="90" cy="102" r="5" fill="#FB923C"/>
    <circle cx="130" cy="102" r="5" fill="#FB923C"/>

    <!-- Bottom Bun -->
    <path d="M20 120 L 160 120 C160 145 20 145 20 120 Z" fill="url(#bunGrad)"/>
  </g>
  <rect x="175" y="16" width="105" height="26" rx="13" fill="#D946EF"/>
  <text x="227" y="33" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BURGER TÔM</text>
</svg>
