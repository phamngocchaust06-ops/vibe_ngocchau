<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </radialGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0369A1" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="150" cy="205" rx="80" ry="14" fill="#000000" opacity="0.08"/>
  <g transform="translate(100, 30)" filter="url(#shadow)">
    <!-- Straw -->
    <path d="M50 35 L 50 10 L 65 0" stroke="#DC2626" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Lid -->
    <ellipse cx="50" cy="35" rx="45" ry="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Cup Body -->
    <path d="M10 35 L 22 165 Q 50 172 78 165 L 90 35 Z" fill="url(#cupGrad)"/>
    
    <!-- Pepsi Globe Symbol -->
    <circle cx="50" cy="100" r="22" fill="#FFFFFF"/>
    <path d="M28 100 A 22 22 0 0 1 72 100 Q 50 112 28 100 Z" fill="#DC2626"/>
    <path d="M28 100 A 22 22 0 0 0 72 100 Q 50 88 28 100 Z" fill="#0284C7"/>

    <text x="50" y="145" font-family="'Impact', sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PEPSI</text>
  </g>
  <rect x="175" y="16" width="105" height="26" rx="13" fill="#0284C7"/>
  <text x="227" y="33" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PEPSI TƯƠI</text>
</svg>
