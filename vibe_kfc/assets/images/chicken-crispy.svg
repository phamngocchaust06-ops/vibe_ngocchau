<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </radialGradient>
    <linearGradient id="crispyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#E11D48" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="150" cy="205" rx="100" ry="14" fill="#000000" opacity="0.08"/>
  <!-- Drumstick -->
  <g transform="translate(60, 30) rotate(-15)" filter="url(#cardShadow)">
    <path d="M50 140 C35 155 25 170 38 180 C50 185 65 175 60 155 Z" fill="#FEF3C7"/>
    <path d="M30 40 C5 75 10 125 50 150 C85 125 95 70 75 35 C60 10 40 20 30 40 Z" fill="url(#crispyGrad)"/>
    <circle cx="40" cy="60" r="12" fill="#FBBF24" opacity="0.6"/>
    <circle cx="65" cy="85" r="14" fill="#B45309" opacity="0.6"/>
    <circle cx="48" cy="115" r="10" fill="#FEF3C7" opacity="0.5"/>
    <!-- spicy chili flake -->
    <polygon points="50,45 55,42 53,50" fill="#DC2626"/>
    <polygon points="65,95 70,92 68,100" fill="#DC2626"/>
    <polygon points="35,105 40,102 38,110" fill="#DC2626"/>
  </g>
  <!-- Crispy badge -->
  <rect x="185" y="16" width="95" height="26" rx="13" fill="#E11D48"/>
  <text x="232" y="33" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GIÒN CAY 🔥</text>
</svg>
